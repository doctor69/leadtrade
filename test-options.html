<!DOCTYPE html>
<html>
<head>
    <title>Test OPTIONS Request</title>
</head>
<body>
    <h1>Test Alpaca Events OPTIONS Request</h1>
    <button onclick="testOptions()">Test OPTIONS</button>
    <button onclick="testGet()">Test GET (will fail without auth)</button>
    <pre id="result"></pre>

    <script>
        const SUPABASE_URL = 'https://bfbqlzpbkivyrnjkvqgl.supabase.co';
        
        async function testOptions() {
            const result = document.getElementById('result');
            result.textContent = 'Testing OPTIONS request...\n';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/alpaca-events/trades`, {
                    method: 'OPTIONS',
                    headers: {
                        'Access-Control-Request-Method': 'GET',
                        'Access-Control-Request-Headers': 'authorization'
                    }
                });
                
                result.textContent += `Status: ${response.status}\n`;
                result.textContent += `Status Text: ${response.statusText}\n\n`;
                result.textContent += 'Headers:\n';
                
                for (const [key, value] of response.headers.entries()) {
                    result.textContent += `  ${key}: ${value}\n`;
                }
                
                if (response.status === 200) {
                    result.textContent += '\n✅ OPTIONS request successful!';
                } else {
                    result.textContent += '\n❌ OPTIONS request failed';
                }
            } catch (error) {
                result.textContent += `\n❌ Error: ${error.message}`;
            }
        }
        
        async function testGet() {
            const result = document.getElementById('result');
            result.textContent = 'Testing GET request (without auth)...\n';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/alpaca-events/trades`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/event-stream'
                    }
                });
                
                result.textContent += `Status: ${response.status}\n`;
                result.textContent += `Status Text: ${response.statusText}\n\n`;
                
                const text = await response.text();
                result.textContent += `Response: ${text}\n`;
                
                if (response.status === 401) {
                    result.textContent += '\n✅ Got 401 (expected - function is working!)';
                } else if (response.status === 503) {
                    result.textContent += '\n❌ Got 503 (function is crashing or not deployed)';
                }
            } catch (error) {
                result.textContent += `\n❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
