name: Deploy Supabase Functions

on:
  push:
    branches:
      - kiro
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Execute Copy Trades Function
        run: supabase functions deploy execute-copy-trades --project-ref bfbqlzpbkivyrnjkvqgl
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Alpaca Orders Function
        run: supabase functions deploy alpaca-orders --project-ref bfbqlzpbkivyrnjkvqgl
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
