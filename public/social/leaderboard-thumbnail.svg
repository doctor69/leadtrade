<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="leaderboardBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaderboardPodiumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaderboardSilverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaderboardBronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cd7c2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a16207;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#leaderboardBgGradient)"/>
  
  <!-- LeadTrade Logo/Brand -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#10b981">LeadTrade</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">Top Traders Leaderboard</text>
  
  <!-- Podium Base -->
  <rect x="400" y="450" width="400" height="20" fill="#374151"/>
  
  <!-- 2nd Place Podium -->
  <rect x="320" y="350" width="120" height="100" fill="url(#leaderboardSilverGradient)"/>
  <text x="380" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e5e7eb" text-anchor="middle">2</text>
  <circle cx="380" cy="300" r="25" fill="#6b7280"/>
  <text x="380" y="280" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Sarah M.</text>
  <text x="380" y="260" font-family="Arial, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">+24.7%</text>
  
  <!-- 1st Place Podium (Tallest) -->
  <rect x="480" y="280" width="120" height="170" fill="url(#leaderboardPodiumGradient)"/>
  <text x="540" y="270" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fbbf24" text-anchor="middle">1</text>
  <circle cx="540" cy="220" r="30" fill="#f59e0b"/>
  <text x="540" y="195" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">Alex K.</text>
  <text x="540" y="175" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle">+31.2%</text>
  <!-- Crown -->
  <polygon points="525,190 540,175 555,190 550,200 530,200" fill="#fbbf24"/>
  
  <!-- 3rd Place Podium -->
  <rect x="640" y="380" width="120" height="70" fill="url(#leaderboardBronzeGradient)"/>
  <text x="700" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#cd7c2f" text-anchor="middle">3</text>
  <circle cx="700" cy="330" r="20" fill="#a16207"/>
  <text x="700" y="315" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Mike R.</text>
  <text x="700" y="300" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">+18.9%</text>
  
  <!-- Leaderboard List -->
  <rect x="800" y="180" width="340" height="300" rx="12" fill="#334155" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
  <text x="820" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">Top Performers</text>
  
  <!-- Leaderboard entries -->
  <text x="820" y="240" font-family="Arial, sans-serif" font-size="14" fill="#fbbf24">1. Alex K.</text>
  <text x="1080" y="240" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+31.2%</text>
  
  <text x="820" y="265" font-family="Arial, sans-serif" font-size="14" fill="#e5e7eb">2. Sarah M.</text>
  <text x="1080" y="265" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+24.7%</text>
  
  <text x="820" y="290" font-family="Arial, sans-serif" font-size="14" fill="#cd7c2f">3. Mike R.</text>
  <text x="1080" y="290" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+18.9%</text>
  
  <text x="820" y="315" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">4. Emma L.</text>
  <text x="1080" y="315" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+16.4%</text>
  
  <text x="820" y="340" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">5. David P.</text>
  <text x="1080" y="340" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+14.8%</text>
  
  <text x="820" y="365" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">6. Lisa W.</text>
  <text x="1080" y="365" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+12.3%</text>
  
  <text x="820" y="390" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">7. John D.</text>
  <text x="1080" y="390" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">+11.7%</text>
  
  <!-- Stats box -->
  <rect x="60" y="180" width="220" height="120" rx="8" fill="#334155" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
  <text x="80" y="205" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Active Traders</text>
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#10b981">1,247</text>
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Following leaders</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">$2.4M copied volume</text>
  
  <!-- Decorative trophy -->
  <polygon points="150,350 170,330 190,350 185,380 155,380" fill="#fbbf24" opacity="0.6"/>
  <rect x="165" y="380" width="10" height="20" fill="#fbbf24" opacity="0.6"/>
  <rect x="160" y="400" width="20" height="5" fill="#fbbf24" opacity="0.6"/>
</svg>