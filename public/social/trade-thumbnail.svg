<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="tradeBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tradeCardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="tradeBuyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#tradeBgGradient)"/>
  
  <!-- LeadTrade Logo/Brand -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#10b981">LeadTrade</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">Advanced Trading Platform</text>
  
  <!-- Trading Interface -->
  <rect x="60" y="160" width="400" height="320" rx="12" fill="url(#tradeCardGradient)" stroke="#475569" stroke-width="1"/>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">Place Order</text>
  
  <!-- Stock selector -->
  <rect x="80" y="210" width="360" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">AAPL</text>
  <text x="380" y="235" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="end">$185.42</text>
  
  <!-- Order type -->
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Order Type</text>
  <rect x="80" y="285" width="120" height="30" rx="4" fill="url(#tradeBuyGradient)" stroke="#10b981" stroke-width="1"/>
  <text x="140" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">BUY</text>
  
  <!-- Quantity -->
  <text x="220" y="275" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Quantity</text>
  <rect x="220" y="285" width="100" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="270" y="305" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">100</text>
  
  <!-- Price -->
  <text x="340" y="275" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Price</text>
  <rect x="340" y="285" width="100" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="390" y="305" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">$185.42</text>
  
  <!-- Order summary -->
  <rect x="80" y="335" width="360" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100" y="355" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Total Order Value</text>
  <text x="100" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0">$18,542.00</text>
  
  <!-- Place order button -->
  <rect x="80" y="415" width="360" height="45" rx="8" fill="#10b981"/>
  <text x="260" y="443" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Place Order</text>
  
  <!-- Market data panel -->
  <rect x="500" y="160" width="320" height="320" rx="12" fill="url(#tradeCardGradient)" stroke="#475569" stroke-width="1"/>
  <text x="520" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">Market Data</text>
  
  <!-- Stock price chart representation -->
  <rect x="520" y="210" width="280" height="150" rx="4" fill="#1e293b"/>
  <polyline points="530,330 550,320 570,310 590,300 610,290 630,280 650,270 670,260 690,250 710,240 730,230 750,220 770,210 790,220" 
            stroke="#10b981" stroke-width="3" fill="none"/>
  
  <!-- Price info -->
  <text x="520" y="385" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Current Price</text>
  <text x="520" y="410" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#10b981">$185.42</text>
  <text x="520" y="435" font-family="Arial, sans-serif" font-size="14" fill="#10b981">+$2.47 (+1.35%)</text>
  
  <!-- Volume info -->
  <text x="650" y="385" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Volume</text>
  <text x="650" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">2.4M</text>
  
  <!-- Copy trading section -->
  <rect x="860" y="160" width="280" height="320" rx="12" fill="url(#tradeCardGradient)" stroke="#475569" stroke-width="1"/>
  <text x="880" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">Copy Trading</text>
  
  <!-- Top trader card -->
  <rect x="880" y="210" width="240" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="910" cy="240" r="15" fill="#10b981"/>
  <text x="935" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Alex K.</text>
  <text x="935" y="250" font-family="Arial, sans-serif" font-size="12" fill="#10b981">+31.2% return</text>
  <text x="935" y="265" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">847 followers</text>
  <rect x="1050" y="225" width="60" height="25" rx="4" fill="#10b981"/>
  <text x="1080" y="242" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Follow</text>
  
  <!-- Copy allocation -->
  <text x="880" y="320" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Copy Allocation</text>
  <rect x="880" y="330" width="240" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="1000" y="350" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">25% of portfolio</text>
  
  <!-- Auto-copy toggle -->
  <text x="880" y="385" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Auto-copy trades</text>
  <rect x="880" y="395" width="50" height="25" rx="12" fill="#10b981"/>
  <circle cx="915" cy="407" r="10" fill="#ffffff"/>
  <text x="950" y="412" font-family="Arial, sans-serif" font-size="12" fill="#10b981">Enabled</text>
  
  <!-- Performance indicator -->
  <text x="880" y="450" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Today's copied trades: 3</text>
  
  <!-- Decorative elements -->
  <circle cx="1050" cy="80" r="30" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>
  <circle cx="950" cy="550" r="40" fill="none" stroke="#10b981" stroke-width="2" opacity="0.2"/>
</svg>