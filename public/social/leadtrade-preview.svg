<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main Content Container -->
  <g transform="translate(80, 80)">
    
    <!-- Logo/Brand Section -->
    <g transform="translate(0, 0)">
      <!-- Logo Icon -->
      <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#accentGradient)"/>
      <path d="M15 30 L30 15 L45 30 L30 45 Z" fill="white" opacity="0.9"/>
      <circle cx="30" cy="30" r="8" fill="white"/>
      
      <!-- Brand Text -->
      <text x="80" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white">
        LEADTRADE
      </text>
      <text x="80" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
        Advanced Trading Platform
      </text>
    </g>
    
    <!-- Feature Highlights -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">
        Trade Like a Pro
      </text>
      <text x="0" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">
        Real-time market data • Copy trading • Paper trading • Social features
      </text>
      
      <!-- Feature Cards -->
      <g transform="translate(0, 70)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="30" cy="30" r="12" fill="#22c55e" opacity="0.2"/>
        <path d="M24 30 L28 34 L36 26" stroke="#22c55e" stroke-width="2" fill="none"/>
        <text x="20" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">
          Real-Time Data
        </text>
        <text x="20" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
          Live market updates
        </text>
        <text x="20" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
          Professional tools
        </text>
        
        <!-- Card 2 -->
        <rect x="220" y="0" width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="250" cy="30" r="12" fill="#3b82f6" opacity="0.2"/>
        <path d="M244 24 L244 36 M250 30 L256 24 M250 30 L256 36" stroke="#3b82f6" stroke-width="2" fill="none"/>
        <text x="240" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">
          Copy Trading
        </text>
        <text x="240" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
          Follow top traders
        </text>
        <text x="240" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
          Automated copying
        </text>
        
        <!-- Card 3 -->
        <rect x="440" y="0" width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="470" cy="30" r="12" fill="#f59e0b" opacity="0.2"/>
        <rect x="464" y="24" width="12" height="12" rx="2" stroke="#f59e0b" stroke-width="2" fill="none"/>
        <text x="460" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">
          Paper Trading
        </text>
        <text x="460" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
          Risk-free practice
        </text>
        <text x="460" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
          $100k virtual funds
        </text>
      </g>
    </g>
    
    <!-- Right Side - Mock Trading Interface -->
    <g transform="translate(700, 0)">
      <!-- Phone/App Mockup -->
      <rect x="0" y="0" width="320" height="400" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="12" y="12" width="296" height="376" rx="16" fill="#1e293b"/>
      
      <!-- Header -->
      <rect x="24" y="24" width="272" height="40" rx="8" fill="#334155"/>
      <text x="36" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">
        Portfolio: $125,847
      </text>
      <text x="36" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e">
        +$25,847 (+25.85%)
      </text>
      
      <!-- Chart Area -->
      <rect x="24" y="80" width="272" height="120" rx="8" fill="#0f172a"/>
      <!-- Simple chart line -->
      <path d="M36 160 Q100 140 150 150 T260 130" stroke="#22c55e" stroke-width="2" fill="none"/>
      <circle cx="260" cy="130" r="3" fill="#22c55e"/>
      
      <!-- Holdings -->
      <g transform="translate(24, 220)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">
          Top Holdings
        </text>
        
        <!-- Stock 1 -->
        <rect x="0" y="16" width="272" height="32" rx="6" fill="#334155"/>
        <text x="12" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">
          AAPL
        </text>
        <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">
          Apple Inc.
        </text>
        <text x="220" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">
          $185.42
        </text>
        <text x="220" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#22c55e">
          +2.34%
        </text>
        
        <!-- Stock 2 -->
        <rect x="0" y="56" width="272" height="32" rx="6" fill="#334155"/>
        <text x="12" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">
          TSLA
        </text>
        <text x="12" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">
          Tesla Inc.
        </text>
        <text x="220" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">
          $248.73
        </text>
        <text x="220" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ef4444">
          -1.23%
        </text>
        
        <!-- Stock 3 -->
        <rect x="0" y="96" width="272" height="32" rx="6" fill="#334155"/>
        <text x="12" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">
          MSFT
        </text>
        <text x="12" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">
          Microsoft Corp.
        </text>
        <text x="220" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">
          $378.85
        </text>
        <text x="220" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#22c55e">
          +0.87%
        </text>
      </g>
    </g>
    
    <!-- Bottom CTA -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="300" height="50" rx="25" fill="url(#accentGradient)"/>
      <text x="150" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">
        Start Trading Today - Free $100K
      </text>
    </g>
    
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="1050" cy="100" r="60" fill="#3b82f6" opacity="0.1"/>
  <circle cx="150" cy="550" r="40" fill="#8b5cf6" opacity="0.1"/>
  
</svg>