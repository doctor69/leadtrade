[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# API redirects for edge functions - MUST come first
[[redirects]]
  from = "/api/*"
  to = "https://bfbqlzpbkivyrnjkvqgl.supabase.co/functions/v1/:splat"
  status = 200
  force = true

# Handle SPA routing for pages
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/trade/*"
  to = "/trade/index.html"
  status = 200

[[redirects]]
  from = "/leaderboard/*"
  to = "/leaderboard/index.html"
  status = 200

[[redirects]]
  from = "/settings/*"
  to = "/settings/index.html"
  status = 200

[[redirects]]
  from = "/signin/*"
  to = "/signin/index.html"
  status = 200

[[redirects]]
  from = "/signup/*"
  to = "/signup/index.html"
  status = 200

# Catch-all for client-side routing (must be last)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for PWA
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"